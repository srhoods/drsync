---
drsync_agent_port: 7440
drsync_agent_source_mount: /mnt/src
drsync_agent_dest_mount: /mnt/dst
drsync_tls_enabled: true

# Walker/copy split as a percentage of ansible_processor_vcpus. Must sum to
# 100. See README.md "Walker/copy thread split" for how this maps to the
# agent's -w/-C flags, and why there's no ceiling above the agent's own
# 1..256 per-pool limit here — a host would have to report 512+ vCPUs to a
# single pool for that to bind, at which point the operator should be
# splitting that box into more than one agent identity rather than tuning
# around it.
drsync_agent_walker_pct: 25
drsync_agent_copy_pct: 75

drsync_agent_uring_enabled: true
drsync_agent_work_stealing_enabled: true
drsync_agent_nofile_limit: 1048576
drsync_agent_fix_io_uring_sysctl: true

# Backstop, not a sizing knob: the agent's own thread pools are bounded by
# -w/-C, but each io_uring ring's kernel-side io-wq offload pool is capped
# per-ring (IORING_REGISTER_IOWQ_MAX_WORKERS, agent/src/uring.c and
# ucopy.c) rather than disabled, so a kernel that ignores the cap or a
# future ring added without one should hit a hard, visible limit — a
# service restart — instead of silently climbing past the systemd default
# (usually ~15% of kernel.pid_max) over a long run.
drsync_agent_tasks_max: 4096
