; Example inventory for a small drsync fleet: one coordinator, three agents.
; Copy this directory (inventories/example -> inventories/prod, etc.), edit
; the hostnames/IPs below and inventories/<yours>/group_vars/all.yml, and
; point ansible-playbook at it with -i.

[drsync_coordinator]
coord01.example.com coordinator_ip=10.0.0.10

[drsync_agents]
agent01.example.com
agent02.example.com
agent03.example.com

[drsync_fleet:children]
drsync_coordinator
drsync_agents
